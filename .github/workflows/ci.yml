name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: No file names that differ only by case (they break Windows and macOS builds)
        run: |
          d=$(git ls-files | sort -f | uniq -di)
          if [ -n "$d" ]; then echo "Case-insensitive name clash: $d"; exit 1; fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - name: FEATURES.md is up to date
        run: |
          npm run features
          git diff --exit-code FEATURES.md || (echo "Run 'npm run features' and commit FEATURES.md" && exit 1)
      - name: Unreleased changes have update notes
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if ! git diff --quiet "origin/${{ github.base_ref }}" -- src src-tauri; then
            git diff "origin/${{ github.base_ref }}" -- CHANGELOG.md | grep -q '^+' || (echo "Add update notes under '## [Unreleased]' in CHANGELOG.md" && exit 1)
          fi

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: System libraries for Tauri
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: mkdir -p dist && echo '<html></html>' > dist/index.html
      - run: cargo check --manifest-path src-tauri/Cargo.toml
