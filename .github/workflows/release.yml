# Builds Tone Suites for Windows, macOS and Android and publishes a GitHub Release.
# Trigger: a push to main that changes the version in package.json (scripts/release.mjs does this),
# or "Run workflow" by hand. If release vX.Y.Z is already published, nothing happens.
# The workflow creates the vX.Y.Z tag itself when it publishes. Release notes come from CHANGELOG.md.
# Desktop apps update in place from latest.json; the signed APK installs over the previous version
# (same package id + same signing key).
name: Release

on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.rel.outputs.id }}
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      skip: ${{ steps.ver.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          # Already published? Only a non-draft release counts (drafts from earlier attempts get rebuilt).
          DRAFT=$(gh api "repos/${{ github.repository }}/releases/tags/v$V" --jq '.draft' 2>/dev/null || echo none)
          if [ "$DRAFT" = "false" ]; then
            echo "v$V is already released — nothing to do."; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Update notes from CHANGELOG.md
        if: steps.ver.outputs.skip != 'true'
        run: node scripts/changelog-section.mjs "${{ steps.ver.outputs.version }}" > notes.md
      - id: rel
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          R="${{ github.repository }}"
          NAME="Tone Suites $TAG"
          # Remove drafts left by earlier attempts at this version (matched by title: a draft's tag_name
          # can read back as "untagged-…").
          for OLD in $(gh api "repos/$R/releases?per_page=100" --jq '.[] | select(.draft and .name=="'"$NAME"'") | .id'); do
            gh api -X DELETE "repos/$R/releases/$OLD"
          done
          ID=$(gh api -X POST "repos/$R/releases" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="$NAME" \
            -F body=@notes.md -F draft=true --jq '.id')
          if [ -z "$ID" ]; then echo "::error::Could not create the draft release for $TAG"; exit 1; fi
          echo "::notice::Draft release $TAG id=$ID"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  desktop:
    needs: create-release
    if: needs.create-release.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--bundles nsis'
          - platform: macos-latest
            args: '--target universal-apple-darwin --bundles app,dmg'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Update notes for the updater manifest (latest.json)
        shell: bash
        run: |
          {
            echo 'NOTES<<TONE_NOTES_EOF'
            node scripts/changelog-section.mjs "${{ needs.create-release.outputs.version }}"
            echo 'TONE_NOTES_EOF'
          } >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          releaseBody: ${{ env.NOTES }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

  android:
    needs: create-release
    if: needs.create-release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.create-release.outputs.tag }}
      NDK_VERSION: 27.2.12479018
      BUILD_TOOLS: 35.0.0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install NDK and build tools (Android SDK is preinstalled on the runner)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;${NDK_VERSION}" "build-tools;${BUILD_TOOLS}" "platforms;android-35" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Generate Android project
        run: |
          npx tauri android init --ci
          npx tauri icon src-tauri/app-icon.png
      - name: Build APK
        run: npx tauri android build --apk --ci --target aarch64 armv7
      - name: Sign APK (stable key — never change it, or updates stop installing over the old app)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'tone' }}
        run: |
          set -e
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tone.jks"
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -1)
          echo "Unsigned APK: $APK"
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          "$BT/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          OUT="ToneSuites-${{ needs.create-release.outputs.version }}.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/tone.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT"
          echo "APK=$OUT" >> "$GITHUB_ENV"
      - name: Upload APK to the release
        # By release id: draft releases can't be found by tag.
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ needs.create-release.outputs.release_id }}
        run: |
          R="${{ github.repository }}"
          OLD=$(gh api "repos/$R/releases/$RID/assets" --jq '.[] | select(.name=="'"$APK"'") | .id')
          if [ -n "$OLD" ]; then gh api -X DELETE "repos/$R/releases/assets/$OLD"; fi
          CODE=$(curl -sS -o resp.json -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK" "https://uploads.github.com/repos/$R/releases/$RID/assets?name=$APK")
          if [ "$CODE" != "201" ]; then echo "::error::APK upload to release '$RID' failed ($CODE): $(head -c 300 resp.json)"; exit 1; fi
          echo "::notice::Uploaded $APK"

  publish:
    needs: [create-release, desktop, android]
    if: needs.create-release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish release (creates the vX.Y.Z tag)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create-release.outputs.tag }}
          RID: ${{ needs.create-release.outputs.release_id }}
        run: gh api -X PATCH "repos/${{ github.repository }}/releases/$RID" -f tag_name="$TAG" -F draft=false -f make_latest=true --jq '.html_url'
